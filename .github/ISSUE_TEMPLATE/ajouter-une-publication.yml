name: Ajouter une publication
description: Ajouter un working paper ou une note de politique
title: "Publication : "
labels: [contenu]
body:
  - type: input
    id: titre
    attributes: { label: Titre }
    validations: { required: true }
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Working Paper, Note de politique]
    validations: { required: true }
  - type: input
    id: auteurs
    attributes: { label: Auteurs, placeholder: "Yann Algan, Antonin Bergeaud, C. Frouard" }
    validations: { required: true }
  - type: input
    id: date
    attributes: { label: Date, placeholder: "Février 2026" }
    validations: { required: true }
  - type: textarea
    id: resume
    attributes: { label: Résumé }
  - type: textarea
    id: pdf
    attributes: { label: PDF, description: Glissez le fichier ici. }
