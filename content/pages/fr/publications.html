
<style>
.pub-page { max-width: 820px; margin: 0 auto; padding: 0 1rem 4rem; }
.pub-page-title { font-family: 'Space Grotesk',sans-serif; font-size: 2rem; font-weight: 700; color: #0E2A47; margin: 0 0 2rem 0; }
.pub-search-wrap { margin-bottom: 1.25rem; position: relative; }
.pub-search-input { font-family: var(--mono,'IBM Plex Mono',monospace); font-size: 0.75rem; letter-spacing: 0.04em; width: 100%; padding: 0.6rem 1rem 0.6rem 2.2rem; border: 1.5px solid #D5DDE8; background: transparent; color: #0E2A47; border-radius: 3px; outline: none; transition: border-color 0.15s; box-sizing: border-box; }
.pub-search-input:focus { border-color: #0E2A47; }
.pub-search-input::placeholder { color: #8C95A0; }
.pub-search-icon { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: #8C95A0; pointer-events: none; }
.pub-filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2.5rem; }
.pub-filter-btn { font-family: var(--mono,'IBM Plex Mono',monospace); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.3rem 0.75rem; border: 1.5px solid #D5DDE8; background: transparent; color: #55657D; border-radius: 3px; cursor: pointer; transition: all 0.15s; }
.pub-filter-btn:hover, .pub-filter-btn.active { background: #0E2A47; border-color: #0E2A47; color: #fff; }
.pub-filter-btn.active-type-wp { background: #3B4FA8; border-color: #3B4FA8; color: #fff; }
.pub-filter-btn.active-type-pb { background: #9A3412; border-color: #9A3412; color: #fff; }
.pub-list { border-top: 1px solid #E5E7EB; }
.pub-entry { padding: 2.2rem 0; border-bottom: 1px solid #E5E7EB; display: grid; grid-template-columns: 1fr 160px; column-gap: 2rem; align-items: start; }
.pub-thumb { grid-column: 2; grid-row: 1 / span 50; width: 160px; height: 160px; border-radius: 6px; overflow: hidden; border: 1px solid #E5E7EB; }
.pub-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (max-width: 640px) { .pub-entry { grid-template-columns: 1fr; } .pub-thumb { grid-column: 1; grid-row: auto; width: 100%; height: 180px; margin-bottom: 1.1rem; } }
.pub-type-line { font-family: var(--mono,'IBM Plex Mono',monospace); font-size: 0.65rem; letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 0.6rem; }
.pub-type-wp { color: #3B4FA8; }
.pub-type-pb { color: #9A3412; }
.pub-entry h3 { font-family: 'Space Grotesk',sans-serif; font-size: 1.2rem; font-weight: 700; color: #0E2A47; margin: 0 0 0.4rem 0; line-height: 1.35; }
.pub-entry h3 a { color: inherit; text-decoration: none; }
.pub-entry h3 a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }
.pub-authors { font-family: 'IBM Plex Sans',sans-serif; font-size: 0.88rem; color: #374151; margin-bottom: 0.25rem; }
.pub-venue { font-family: 'IBM Plex Sans',sans-serif; font-size: 0.85rem; color: #6B7280; font-style: italic; margin-bottom: 0.8rem; }
.pub-cats { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 1rem; }
.pub-cats .pub-cat { font-family: var(--mono,'IBM Plex Mono',monospace); font-size: 0.6rem; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.12rem 0.45rem; border: 1px solid #D5DDE8; color: #7888A0; border-radius: 2px; }
.pub-abstract-body { display: none; background: #F8FAFC; border-left: 3px solid #D5DDE8; padding: 1rem 1.25rem; margin-bottom: 1rem; font-family: 'IBM Plex Sans',sans-serif; font-size: 0.9rem; color: #374151; line-height: 1.7; border-radius: 0 4px 4px 0; }
.pub-abstract-body.open { display: block; }
.pub-actions { display: flex; gap: 0.6rem; align-items: center; }
.pub-abstract-btn { font-family: var(--mono,'IBM Plex Mono',monospace); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.35rem 0.9rem; border: 1.5px solid #0E2A47; background: transparent; color: #0E2A47; border-radius: 3px; cursor: pointer; transition: all 0.15s; }
.pub-abstract-btn:hover, .pub-abstract-btn.open { background: #0E2A47; color: #fff; }
.pub-pdf-btn { font-family: var(--mono,'IBM Plex Mono',monospace); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.35rem 0.9rem; border: 1.5px solid #D5DDE8; background: transparent; color: #55657D; border-radius: 3px; text-decoration: none; transition: all 0.15s; }
.pub-pdf-btn:hover { border-color: #6B7280; color: #374151; text-decoration: none; }
.pub-lire-btn { font-family: var(--mono,'IBM Plex Mono',monospace); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.35rem 0.9rem; border: 1.5px solid #0E2A47; background: #0E2A47; color: #fff; border-radius: 3px; text-decoration: none; transition: all 0.15s; }
.pub-lire-btn:hover { background: transparent; color: #0E2A47; text-decoration: none; }
</style>

<div class="pub-page">
<h1 class="pub-page-title">Nos Publications</h1>

<div class="pub-search-wrap">
  <svg class="pub-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  <input type="text" id="pub-search" class="pub-search-input" placeholder="Rechercher par titre, auteur, thème…" autocomplete="off">
</div>
<div class="pub-filter-bar" id="pub-filter-bar">
  <button class="pub-filter-btn active" data-filter="all">Toutes</button>
  <button class="pub-filter-btn" data-filter="type-wp">Working Papers</button>
  <button class="pub-filter-btn" data-filter="type-pb">Notes de politique</button>
  <button class="pub-filter-btn" data-filter="tag-AI">AI</button>
  <button class="pub-filter-btn" data-filter="tag-Innovation">Innovation</button>
  <button class="pub-filter-btn" data-filter="tag-Emploi">Emploi</button>
  <button class="pub-filter-btn" data-filter="tag-France">France</button>
  <button class="pub-filter-btn" data-filter="tag-Europe">Europe</button>
  <button class="pub-filter-btn" data-filter="tag-Démocratie">Démocratie</button>
</div>

<div class="pub-list" id="pub-list">

{{liste_publications}}

</div>
</div>

<script>
function toggleAbstract(btn) {
  const abstract = btn.closest('.pub-entry').querySelector('.pub-abstract-body');
  const isOpen = abstract.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  btn.textContent = isOpen ? 'Abstract ↑' : 'Abstract ↓';
}

function applyFilters() {
  const activeBtn = document.querySelector('.pub-filter-btn.active');
  const filter = activeBtn ? activeBtn.dataset.filter : 'all';
  const search = (document.getElementById('pub-search').value || '').toLowerCase().trim();
  document.querySelectorAll('#pub-list .pub-entry').forEach(entry => {
    let show = true;
    if (filter !== 'all') {
      if (filter.startsWith('type-')) {
        show = entry.dataset.type === filter.replace('type-', '');
      } else if (filter.startsWith('tag-')) {
        show = (entry.dataset.tags || '').includes(filter.replace('tag-', ''));
      }
    }
    if (show && search) {
      show = entry.textContent.toLowerCase().includes(search);
    }
    entry.style.display = show ? '' : 'none';
  });
}

document.getElementById('pub-filter-bar').addEventListener('click', function(e) {
  const btn = e.target.closest('.pub-filter-btn');
  if (!btn) return;
  document.querySelectorAll('.pub-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
});

document.getElementById('pub-search').addEventListener('input', applyFilters);
</script>
